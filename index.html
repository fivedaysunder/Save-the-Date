<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save the Date</title>
<script>document.documentElement.classList.add('js','sealed');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Italiana&display=swap" rel="stylesheet">
<style>
/* Layout idea: an indigo block-printed cloth cracks along a gold seam and slides apart, revealing a light ivory page of arch-shaped day panels. */
:root{
  --indigo:#26305a;
  --cream:#eadfcb;
  --ivory:#f8f0ea;
  --blush:#efd3ca;
  --madder:#b84c30;
  --gold:#e3a93a;
  --turmeric:#f2dfa3;
  --ink:#262a4a;
  --slate:#7596a8;
  --olive:#566b28;
  --mustard:#d2a03a;
  --pink:#e5a7a0;
  --terracotta:#c9583c;
  --oat:#e4ddd0;
  --display:'Italiana','Bodoni Moda',Georgia,serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:light}
html.js.sealed{overflow:hidden}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--body);font-size:1.05rem;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.eyebrow{font-size:.76rem;letter-spacing:.24em;text-transform:uppercase;font-weight:600}

/* ---------- The sealed cover ---------- */
.game{display:none;position:fixed;inset:0;z-index:50;height:100vh;height:100dvh;flex-direction:column;align-items:center;background-color:var(--indigo);background-image:var(--tile-cover);background-size:180px 180px;color:var(--cream);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.js .game:not([hidden]){display:flex}
.gtop{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(16px,calc((100% - 640px)/2)) 10px;background:var(--indigo);box-shadow:0 6px 14px rgba(6,8,28,.35);position:relative;z-index:2;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.gtitle{flex:1;text-align:center;opacity:.9}
.gleft{display:flex;align-items:center;gap:10px;min-width:96px}
.lives{display:flex;gap:4px}
.lives svg{width:18px;height:16px;color:var(--pink);--cut:var(--indigo)}
.score{min-width:2ch;font-variant-numeric:tabular-nums}
.gmid{position:relative;flex:1;min-height:0;width:100%;display:grid;place-items:center}
#board{border-radius:14px;background:#141a38;box-shadow:0 0 0 2px rgba(234,223,203,.55),0 12px 30px rgba(6,8,28,.55)}
.gcard{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:14px;text-align:center;padding:16px;background:rgba(20,26,56,.86)}
.gcard[hidden]{display:none}
.gcard .plate{width:min(84vw,330px);padding:clamp(3.2rem,15vw,4.4rem) 1.4rem 1.5rem}
.gcard .plate .names{margin:.7rem 0 .7rem;font-size:clamp(1.7rem,7.6vw,2.4rem)}
.gcard .plate .date{font-size:.92rem;letter-spacing:.05em;text-transform:none;line-height:1.4;max-width:22ch;margin:0 auto;text-wrap:balance}
.gcard .amp{animation:beat 1.4s ease-in-out infinite}
.gcard .big{font-family:var(--display);font-size:clamp(2.2rem,9vw,3rem);line-height:1.05}
.gcard .gtip{max-width:30ch;font-size:.95rem}
.cast{display:flex;gap:12px;justify-content:center}
.cast figure{margin:0;display:grid;justify-items:center;gap:4px}
.cast button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:4px;padding:4px;border-radius:14px;-webkit-tap-highlight-color:transparent}
.cast button:focus-visible{outline:2px solid var(--cream)}
.cast button.on img{border-color:#f6d98a;box-shadow:0 0 0 3px rgba(246,217,138,.45);transform:scale(1.08)}
.cast button.on figcaption{color:#f6d98a}
.cast img{transition:transform .15s,box-shadow .15s}
.pickhint{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin:.55rem 0 0;text-align:center}
.cast img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--cream);background:var(--indigo)}
.cast figcaption{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase}
.gbtns{display:grid;gap:10px;justify-items:center}
.gbot{width:100%;display:grid;justify-items:center;gap:6px;padding:10px 16px max(14px,env(safe-area-inset-bottom));background:var(--indigo);box-shadow:0 -6px 14px rgba(6,8,28,.35);position:relative;z-index:2}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,50px);gap:6px}
.dpad button{display:grid;place-items:center;background:var(--indigo);color:var(--cream);border:1px solid rgba(234,223,203,.7);border-radius:12px;cursor:pointer;padding:0}
.dpad button:active{background:#3a4678}
.dpad svg{width:22px;height:22px}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
.keyhint{display:none;font-size:.8rem;opacity:.75;margin:0}
@media (hover:hover) and (pointer:fine){.dpad{display:none}.keyhint{display:block}}
.skip{font:inherit;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);background:none;border:1px solid rgba(234,223,203,.6);border-radius:999px;cursor:pointer;padding:.45rem .9rem;min-width:96px;margin:-.3rem 0}
.plate{width:min(78vw,380px);padding:clamp(3.5rem,16vw,6rem) 1.5rem clamp(2.5rem,9vw,3.5rem);background:var(--indigo);border:1px solid var(--cream);border-radius:999px 999px 14px 14px;outline:1px solid rgba(234,223,203,.45);outline-offset:7px;text-align:center}
.plate .names{font-family:var(--display);font-size:clamp(2rem,9.5vw,3.3rem);line-height:1;margin:1.1rem 0 1rem;white-space:nowrap}
.amp{display:inline-block;width:.7em;height:.63em;vertical-align:-.04em;margin:0 .14em;color:var(--gold);--cut:var(--indigo)}
.plate .date{font-size:.85rem;letter-spacing:.2em;text-transform:uppercase}
.hint{font:inherit;color:var(--cream);background:var(--indigo);border:1px solid var(--cream);border-radius:99px;padding:.7rem 1.5rem;display:grid;gap:.1rem;text-align:center;cursor:pointer;opacity:0;animation:rise .9s .8s both}
.hint b{font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:.78rem}
.hint span{font-size:.82rem;opacity:.75}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

/* ---------- The page inside ---------- */
main{display:block}
main:focus{outline:none}
.hero{position:relative;isolation:isolate;text-align:center;padding:clamp(4.5rem,12vw,8rem) 1.25rem clamp(3rem,8vw,4.5rem)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background-image:var(--tile-faint);background-size:170px 170px;opacity:.4;-webkit-mask-image:linear-gradient(#000 15%,transparent 92%);mask-image:linear-gradient(#000 15%,transparent 92%)}
.hero h1{font-size:clamp(2.8rem,13vw,8rem);line-height:.95;color:var(--indigo);margin:1.1rem 0 1.2rem;letter-spacing:.01em}
.hero h1 .amp{width:.5em;height:.45em;color:var(--madder);--cut:var(--ivory);margin:0 .22em;vertical-align:.04em}
.when{font-size:1.15rem;letter-spacing:.04em;line-height:1.4;max-width:24ch;margin:0 auto;text-wrap:balance}
.count{display:inline-block;margin-top:1.2rem;padding:.35rem 1.05rem;border:1px solid var(--madder);border-radius:99px;font-size:.85rem;font-weight:600;letter-spacing:.06em;color:var(--madder)}
.lede{max-width:34ch;margin:1.6rem auto 0;font-size:1.15rem}
.more{display:grid;place-items:center;padding:4rem 1.25rem 5rem}
.more .arch{width:min(100%,320px);padding-top:5rem}
.band{height:28px;background-image:var(--tile-band);background-size:56px 56px;background-position:center top;background-repeat:repeat-x;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}

.days{max-width:1080px;margin:0 auto;padding:3.5rem 1.25rem 4.5rem}
.days>h2,.notes>h2{text-align:center;font-size:clamp(2rem,6vw,3.1rem);color:var(--indigo)}
.arches{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.75rem;margin-top:2.5rem}
.arch{position:relative;text-align:center;padding:4.6rem 1.6rem 2.2rem;border-radius:999px 999px 20px 20px}
.arch::before{content:"";position:absolute;inset:10px;border:1px solid currentColor;border-radius:inherit;opacity:.3;pointer-events:none}
.arch .bloom{position:absolute;top:2.1rem;left:50%;width:34px;height:34px;margin-left:-17px}
.arch .dow{font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;font-weight:600}
.arch .date{font-family:var(--display);font-size:1.5rem;margin-top:.1rem}
.arch h3{font-size:2.5rem;margin:.9rem 0 .6rem;line-height:1}
.arch .about{max-width:24ch;margin:0 auto}
.arch .tbd{margin-top:1.3rem;font-size:.82rem;letter-spacing:.06em;font-weight:500;opacity:.8}
.a1{background:var(--pink);color:var(--ink)}
.a2{background:var(--mustard);color:var(--ink)}
.a3{background:var(--olive);color:var(--cream)}
.a3 .date{color:var(--cream)}
.where{background:#cddbe0;padding:clamp(3.5rem,9vw,6rem) 1.25rem}
.where .in{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2rem 4rem;align-items:center}
.where h2{font-size:clamp(2.2rem,6.5vw,3.6rem);line-height:1.05;color:var(--indigo)}
.where p+p{margin-top:1rem}

.notes{max-width:1000px;margin:0 auto;padding:4.5rem 1.25rem}
.notes dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2rem;margin:2.5rem 0 0}
.notes dt{font-size:.76rem;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--madder);padding-top:1rem;border-top:1px solid var(--indigo)}
.notes dd{margin:.5rem 0 0}

.foot{background-color:var(--indigo);background-image:var(--tile-cover);background-size:180px 180px;padding:clamp(3rem,9vw,5rem) 1.25rem;display:grid;place-items:center;color:var(--cream)}
.foot .plate{padding-top:clamp(2.5rem,10vw,3.5rem)}
.foot .names{font-family:var(--display);font-size:clamp(2.2rem,9vw,3rem);margin:.7rem 0 1.2rem;white-space:nowrap}
.replay{font:inherit;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);background:none;border:1px solid var(--cream);border-radius:99px;padding:.55rem 1.2rem;cursor:pointer}
.replay:hover{background:rgba(234,223,203,.12)}

@media (prefers-reduced-motion:reduce){
  .gcard .amp{animation:none}
  .hint{animation:none;opacity:1}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="bloom" viewBox="-20 -20 40 40">
    <g fill="currentColor">
      <ellipse cx="0" cy="-10" rx="4.4" ry="8"/>
      <ellipse cx="0" cy="-10" rx="4.4" ry="8" transform="rotate(60)"/>
      <ellipse cx="0" cy="-10" rx="4.4" ry="8" transform="rotate(120)"/>
      <ellipse cx="0" cy="-10" rx="4.4" ry="8" transform="rotate(180)"/>
      <ellipse cx="0" cy="-10" rx="4.4" ry="8" transform="rotate(240)"/>
      <ellipse cx="0" cy="-10" rx="4.4" ry="8" transform="rotate(300)"/>
    </g>
    <circle r="3.2" fill="var(--bloom-eye,#f8f0ea)"/>
  </symbol>
  <symbol id="heart" viewBox="0 0 40 36">
    <path fill="currentColor" d="M20 34 C6 24 2 16 2 10.5 C2 5.5 6 2 10.5 2 C14.5 2 18 4.5 20 8.5 C22 4.5 25.5 2 29.5 2 C34 2 38 5.5 38 10.5 C38 16 34 24 20 34Z"/>
    <g fill="none" stroke="var(--cut,#f8f0ea)" stroke-width="1.5" stroke-linecap="round">
      <path d="M9.5 8.5 C6.5 9.5 5.5 12.5 7.5 15.5"/>
      <path d="M30.5 8.5 C33.5 9.5 34.5 12.5 32.5 15.5"/>
    </g>
    <g fill="var(--cut,#f8f0ea)"><circle cx="20" cy="10.5" r="1.7"/><circle cx="14.5" cy="19" r="1.2"/><circle cx="25.5" cy="19" r="1.2"/><circle cx="20" cy="28" r="1.1"/></g>
  </symbol>
</svg>

<div class="game" id="game" role="dialog" aria-label="Save the date for Simran and Adam. Play a short game, or skip to the date.">
  <div class="gtop" id="gtop">
    <div class="gleft"><div class="lives" id="lives" aria-label="Lives"></div><div class="score" id="score" aria-live="off">0</div></div>
    <div class="gtitle">April 9 &ndash; 10, 2027</div>
    <button class="skip" id="skip" type="button">Skip</button>
  </div>
  <div class="gmid" id="gmid">
    <canvas id="board" role="img" aria-label="Maze game: guide Simran to collect every marigold while Adam and two sighthounds chase her."></canvas>
    <div class="gcard" id="gcard"></div>
  </div>
  <div class="gbot" id="gbot">
    <div class="dpad" id="dpad" aria-hidden="true">
      <button type="button" class="u" data-dir="up" tabindex="-1"><svg viewBox="0 0 24 24"><path d="M12 5 L20 18 H4Z" fill="currentColor"/></svg></button>
      <button type="button" class="l" data-dir="left" tabindex="-1"><svg viewBox="0 0 24 24" style="transform:rotate(-90deg)"><path d="M12 5 L20 18 H4Z" fill="currentColor"/></svg></button>
      <button type="button" class="d" data-dir="down" tabindex="-1"><svg viewBox="0 0 24 24" style="transform:rotate(180deg)"><path d="M12 5 L20 18 H4Z" fill="currentColor"/></svg></button>
      <button type="button" class="r" data-dir="right" tabindex="-1"><svg viewBox="0 0 24 24" style="transform:rotate(90deg)"><path d="M12 5 L20 18 H4Z" fill="currentColor"/></svg></button>
    </div>
    <p class="keyhint">Arrow keys or WASD to move</p>
  </div>
</div>

<main id="main" tabindex="-1">
  <header class="hero">
    <p class="eyebrow">Save the date &middot; 2027</p>
    <h1 aria-label="Simran and Adam"><span aria-hidden="true">Simran<svg class="amp" role="img" aria-label="and"><use href="#heart"/></svg>Adam</span></h1>
    <p class="when">Festivities from Friday April 9th to Saturday April 10th</p>
    <p class="count" id="count" hidden></p>
  </header>

  <div class="band" aria-hidden="true"></div>

  <section class="more" aria-labelledby="more-h">
    <article class="arch a1">
      <svg class="bloom" aria-hidden="true"><use href="#bloom"/></svg>
      <h3 id="more-h">More to come</h3>
      <p class="about">The invitation, the schedule and the address will follow.</p>
    </article>
  </section>

  <footer class="foot">
    <div class="plate">
      <p class="eyebrow">With love</p>
      <p class="names">Simran <svg class="amp" role="img" aria-label="and"><use href="#heart"/></svg> Adam</p>
      <button class="replay" id="replay" type="button">Play again</button>
    </div>
  </footer>
</main>

<script>
(function(){
  /* ---- Block-print tiles, built once and handed to CSS ---- */
  function flower(x,y,c){
    var s='<g transform="translate('+x+' '+y+')"><g fill="'+c.flower+'">';
    for(var i=0;i<8;i++) s+='<ellipse cx="0" cy="-14" rx="5.2" ry="11" transform="rotate('+(i*45)+')"/>';
    s+='</g><circle r="6.5" fill="'+c.cut+'"/><circle r="3" fill="'+c.eye+'"/><g fill="'+c.ring+'">';
    for(var j=0;j<8;j++){var a=(j*45+22.5)*Math.PI/180;s+='<circle cx="'+(31*Math.sin(a)).toFixed(1)+'" cy="'+(-31*Math.cos(a)).toFixed(1)+'" r="1.7"/>';}
    return s+'</g></g>';
  }
  function buta(x,y,rot,c){
    return '<g transform="translate('+x+' '+y+') rotate('+rot+')">'+
      '<path fill="'+c.buta+'" d="M0,-26 C16,-20 21,4 9,19 C2,28 -14,24 -14,9 C-14,-2 -3,-8 0,-18 Z"/>'+
      '<path d="M0,-15 C9,-9 11,6 4,14" fill="none" stroke="'+c.cut+'" stroke-width="2.4" stroke-linecap="round"/>'+
      '<circle cx="-5" cy="13" r="2" fill="'+c.cut+'"/><circle cx="-4" cy="5" r="1.6" fill="'+c.cut+'"/></g>';
  }
  function tile(c){
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">'+
      '<defs><filter id="w" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter></defs>'+
      '<g filter="url(#w)">'+flower(50,50,c)+flower(150,150,c)+buta(150,50,0,c)+buta(50,150,180,c)+
      '<path fill="'+c.star+'" d="M100,90 L103,97 L110,100 L103,103 L100,110 L97,103 L90,100 L97,97Z"/></g></svg>';
    return 'url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
  }
  var root=document.documentElement.style;
  root.setProperty('--tile-cover',tile({flower:'#eadfcb',eye:'#d2a03a',ring:'#d9684a',buta:'#e5a7a0',star:'#d2a03a',cut:'#26305a'}));
  root.setProperty('--tile-faint',tile({flower:'#7596a8',eye:'#d2a03a',ring:'#e5a7a0',buta:'#566b28',star:'#d2a03a',cut:'#f8f0ea'}));
  root.setProperty('--tile-band',tile({flower:'#7596a8',eye:'#d2a03a',ring:'#c9583c',buta:'#566b28',star:'#c9583c',cut:'#f8f0ea'}));

  /* ---- Countdown ---- */
  var target=new Date(2027,3,9), now=new Date();
  var days=Math.ceil((target-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
  var count=document.getElementById('count');
  if(days>1){count.textContent=days+' days to go';count.hidden=false;}
  else if(days===1){count.textContent='Tomorrow';count.hidden=false;}
  else if(days===0){count.textContent='Today is the day';count.hidden=false;}

  /* ---- The opening game: Simran, the marigolds, and the hounds ---- */
  var game=document.getElementById('game'), main=document.getElementById('main');
  var cv=document.getElementById('board'), ctx=cv.getContext('2d');
  var gcard=document.getElementById('gcard'), scoreEl=document.getElementById('score'), livesEl=document.getElementById('lives');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var COLORS=['#e5a7a0','#d2a03a','#c9583c','#7596a8','#566b28','#eadfcb','#f6d98a'];
  function confetti(ox,oy){
    var cv=document.createElement('canvas'),dpr=Math.min(2,window.devicePixelRatio||1);
    var W=window.innerWidth,H=window.innerHeight,small=W<600;
    cv.width=W*dpr;cv.height=H*dpr;
    cv.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;z-index:60;pointer-events:none';
    document.body.appendChild(cv);
    var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    var P=[];
    function burst(x,y,n,center,spread,smin,smax){
      for(var i=0;i<n;i++){
        var a=center+(Math.random()*2-1)*spread,sp=smin+Math.random()*(smax-smin);
        P.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,s:6+Math.random()*7,shape:Math.floor(Math.random()*4),
          col:COLORS[Math.floor(Math.random()*COLORS.length)],rot:Math.random()*6.28,vr:(Math.random()*2-1)*9,
          wob:Math.random()*6.28,vw:4+Math.random()*6,life:0,max:2.6+Math.random()*1.4});
      }
    }
    burst(ox,oy,small?90:140,0,Math.PI,600,1500);
    setTimeout(function(){
      burst(0,H*0.9,small?40:60,-Math.PI/3,0.35,1000,1800);
      burst(W,H*0.9,small?40:60,-2*Math.PI/3,0.35,1000,1800);
    },300);
    var last=performance.now(),start=last;
    function tick(now){
      var dt=Math.min(0.034,(now-last)/1000);last=now;
      ctx.clearRect(0,0,W,H);
      var k=Math.pow(0.05,dt);
      for(var i=P.length-1;i>=0;i--){
        var p=P[i];
        p.life+=dt;p.vx*=k;p.vy=p.vy*k+900*dt;
        p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.wob+=p.vw*dt;
        if(p.y>H+40||p.life>p.max){P.splice(i,1);continue;}
        var fade=p.life>p.max*0.7?1-(p.life-p.max*0.7)/(p.max*0.3):1;
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.max(0,fade);ctx.fillStyle=p.col;
        if(p.shape===0){ctx.scale(1,Math.cos(p.wob));ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66);}
        else if(p.shape===1){ctx.beginPath();ctx.arc(0,0,p.s/2.4,0,6.283);ctx.fill();}
        else if(p.shape===2){ctx.beginPath();ctx.ellipse(0,0,p.s/2,p.s/4,0,0,6.283);ctx.fill();}
        else{ctx.scale(1,Math.cos(p.wob));ctx.fillRect(-p.s*0.9,-1.5,p.s*1.8,3);}
        ctx.restore();
      }

  /* movement on a tile grid; tile centres sit on integer coordinates */
  function stepEntity(e,dt,choose){
    var rem=e.speed*dt,guard=0;
    while(rem>1e-6&&guard++<8){
      var rx=Math.round(e.x),ry=Math.round(e.y);
      if(Math.abs(e.x-rx)<1e-6&&Math.abs(e.y-ry)<1e-6){e.x=rx;e.y=ry;choose(e);if(!e.dir)break;}
      var d=e.dir,dist;
      if(d.x!==0){var nx=d.x>0?Math.floor(e.x+1e-6)+1:Math.ceil(e.x-1e-6)-1;dist=Math.abs(nx-e.x);}
      else{var ny=d.y>0?Math.floor(e.y+1e-6)+1:Math.ceil(e.y-1e-6)-1;dist=Math.abs(ny-e.y);}
      var st=Math.min(rem,dist);

    }

  function bfsDir(sx,sy,tx,ty){

      if(cur[0]===tx&&cur[1]===ty)return cur[2];
      for(var i=0;i<4;i++){
        var d=DIRS[ORDER[i]],nx=cur[0]+d.x,ny=cur[1]+d.y;
        if(!passG(nx,ny)||seen[k(nx,ny)])continue;

    if(g.id==='saluki'){var pd=player.dir||DIRS[player.face];return [px+pd.x*4,py+pd.y*4];}
    if(g.id==='whippet'){var dx=px-g.x,dy=py-g.y;return (dx*dx+dy*dy>36)?[px,py]:[1,15];}

  }
  function ghostChoose(g){
    var cx=g.x,cy=g.y;
    if(g.mode==='house'){g.dir=null;return;}
    if(g.mode==='leaving'){if(cx===7&&cy===10)g.mode='chase';else{setGhostDir(g,bfsDir(cx,cy,7,10));return;}}
    if(g.mode==='eaten'){if(cx===7&&cy===8){g.mode='house';g.wait=1.6;g.dir=null;return;}setGhostDir(g,bfsDir(cx,cy,7,8));return;}
    var opts=[];
    for(var i=0;i<4;i++){
      var d=DIRS[ORDER[i]],nx=cx+d.x,ny=cy+d.y;
      if(!passG(nx,ny)||inHouse(nx,ny))continue;
      if(g.dir&&d.x===-g.dir.x&&d.y===-g.dir.y)continue;
      opts.push(d);
    }
    if(!opts.length){if(g.dir)setGhostDir(g,{x:-g.dir.x,y:-g.dir.y});return;}
    var pick;
    if(scared>0||Math.random()<0.14)pick=opts[Math.floor(Math.random()*opts.length)];

  function setWant(name){

  function update(dt){

      return;
    }
    if(scared>0)scared=Math.max(0,scared-dt);

    stepEntity(player,dt,playerChoose);
    player.phase+=dt*(player.dir?16:3);
    var pc=Math.round(player.x),pr=Math.round(player.y);
    if(Math.abs(player.x-pc)<0.4&&Math.abs(player.y-pr)<0.4&&items[pr]&&items[pr][pc]){

      if(r<ROWS-1&&MAP[r+1][c]!=='#'){ctx.moveTo(c*s,(r+1)*s);ctx.lineTo((c+1)*s,(r+1)*s);}
      if(c>0&&MAP[r][c-1]!=='#'){ctx.moveTo(c*s,r*s);ctx.lineTo(c*s,(r+1)*s);}

      ctx.drawImage(IMG[hero],-pr2,-pr2,pr2*2,pr2*2);ctx.restore();return;
    }
    if(player.face==='left')ctx.scale(-1,1);else if(player.face==='up')ctx.rotate(-Math.PI/2);else if(player.face==='down')ctx.rotate(Math.PI/2);
    ctx.fillStyle='#2b2019';ctx.beginPath();ctx.arc(-r*0.12,0,r*1.1,Math.PI*0.5,Math.PI*1.5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#e0b08a';ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,m,6.283-m);ctx.closePath();ctx.fill();
    ctx.fillStyle='#26305a';ctx.beginPath();ctx.arc(r*0.16,-r*0.5,r*0.12,0,6.283);ctx.fill();
    ctx.fillStyle='#e5a7a0';ctx.beginPath();ctx.arc(-r*0.3,-r*0.86,r*0.24,0,6.283);ctx.fill();
    ctx.fillStyle='#d2a03a';ctx.beginPath();ctx.arc(-r*0.3,-r*0.86,r*0.09,0,6.283);ctx.fill();
    ctx.restore();
  }
  function drawGhost(g){
    var s=cell,r=s*0.46,px=(g.x+.5)*s,py=(g.y+.5)*s;
    if(g.mode==='house')py+=Math.sin(clock*5+g.x)*s*0.06;
    var isScared=scared>0&&g.mode!=='eaten'&&g.mode!=='house';
    var flash=isScared&&scared<2&&Math.floor(clock*6)%2===0;
    var base=g.id==='adam'?'#c9583c':(g.id==='saluki'?'#d89a5a':'#eadfcb');
    var im=IMG[PHOTOKEY[g.id]],hasPhoto=ready(im);
    ctx.save();ctx.translate(px,py);
    if(g.mode==='eaten'){
      eyes(r,g.fx,g.fy,'#fff','#26305a');ctx.restore();return;
    }
    ctx.fillStyle=isScared?(flash?'#eadfcb':'#7596a8'):base;
    var w=Math.sin(clock*10)*r*0.08;
    ctx.beginPath();ctx.arc(0,-r*0.1,r,Math.PI,0);
    ctx.lineTo(r,r*0.95);ctx.lineTo(r*0.66,r*0.6+w);ctx.lineTo(r*0.33,r*0.95);ctx.lineTo(0,r*0.6-w);
    ctx.lineTo(-r*0.33,r*0.95);ctx.lineTo(-r*0.66,r*0.6+w);ctx.lineTo(-r,r*0.95);ctx.closePath();ctx.fill();
    if(hasPhoto){
      var hr=r*0.9,hy=-r*0.24;
      ctx.save();ctx.beginPath();ctx.arc(0,hy,hr,0,6.283);ctx.clip();
      ctx.drawImage(im,-hr,hy-hr,hr*2,hr*2);
      if(isScared){ctx.fillStyle=flash?'rgba(234,223,203,.6)':'rgba(117,150,168,.62)';ctx.fillRect(-hr,hy-hr,hr*2,hr*2);}
      ctx.restore();
      ctx.strokeStyle=isScared?(flash?'#eadfcb':'#7596a8'):base;ctx.lineWidth=Math.max(1.5,r*0.16);
      ctx.beginPath();ctx.arc(0,hy,hr,0,6.283);ctx.stroke();
    }else if(isScared){
      ctx.fillStyle=flash?'#c9583c':'#eadfcb';
      ctx.beginPath();ctx.arc(-r*0.32,-r*0.28,r*0.13,0,6.283);ctx.arc(r*0.32,-r*0.28,r*0.13,0,6.283);ctx.fill();
      ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=Math.max(1,r*0.1);ctx.beginPath();
      ctx.moveTo(-r*0.5,r*0.22);for(var i=1;i<=4;i++)ctx.lineTo(-r*0.5+i*r*0.25,r*0.22+(i%2?-r*0.12:r*0.12));ctx.stroke();
    }else if(g.id==='adam'){
      ctx.fillStyle='#d9a77d';ctx.beginPath();ctx.arc(0,-r*0.18,r*0.62,0,6.283);ctx.fill();
      ctx.fillStyle='#2b2019';ctx.beginPath();ctx.arc(0,-r*0.2,r*0.66,Math.PI*1.04,Math.PI*1.96);ctx.closePath();ctx.fill();
      eyes(r*0.9,g.fx*0.6,g.fy*0.6,'#26305a',null,-r*0.14);
      ctx.strokeStyle='#26305a';ctx.lineWidth=Math.max(1,r*0.08);ctx.beginPath();ctx.arc(g.fx*r*0.06,-r*0.02,r*0.2,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
    }else{
      var sa=g.id==='saluki';
      ctx.fillStyle=sa?'#cfc2a8':'#b98450';
      if(sa){ctx.beginPath();ctx.ellipse(-r*0.82,-r*0.05,r*0.2,r*0.55,0,0,6.283);ctx.ellipse(r*0.82,-r*0.05,r*0.2,r*0.55,0,0,6.283);ctx.fill();}
      else{ctx.beginPath();ctx.ellipse(-r*0.55,-r*0.88,r*0.17,r*0.3,-0.5,0,6.283);ctx.ellipse(r*0.55,-r*0.88,r*0.17,r*0.3,0.5,0,6.283);ctx.fill();}
      ctx.fillStyle=sa?'#e6dac2':'#e0b98c';
      ctx.beginPath();ctx.ellipse(g.fx*r*0.42,-r*0.12+g.fy*r*0.28,r*0.42,r*0.26,0,0,6.283);ctx.fill();
      ctx.fillStyle='#26305a';ctx.beginPath();ctx.arc(g.fx*r*0.8,-r*0.12+g.fy*r*0.4,r*0.1,0,6.283);ctx.fill();
      eyes(r*0.9,g.fx*0.5,g.fy*0.5,'#26305a',null,-r*0.38);
    }
    ctx.restore();
  }
  function eyes(r,fx,fy,col,pupil,yo){
    var y=(yo===undefined?-r*0.28:yo);
    [-1,1].forEach(function(sg){
      var ex=sg*r*0.34;
      if(pupil){ctx.fillStyle=col;ctx.beginPath();ctx.arc(ex,y,r*0.22,0,6.283);ctx.fill();ctx.fillStyle=pupil;ctx.beginPath();ctx.arc(ex+fx*r*0.1,y+fy*r*0.1,r*0.1,0,6.283);ctx.fill();}
      else{ctx.fillStyle=col;ctx.beginPath();ctx.arc(ex+fx*r*0.08,y+fy*r*0.06,r*0.1,0,6.283);ctx.fill();}
    });
  }
  function draw(){
    drawBoard();drawItems();
    if(!ghosts)return;
    ghosts.forEach(drawGhost);
    drawPlayer();
    for(var i=popups.length-1;i>=0;i--){
      var p=popups[i];p.t+=0.016;
      if(p.t>0.9){popups.splice(i,1);continue;}
      ctx.globalAlpha=1-p.t/0.9;ctx.fillStyle='#f6d98a';ctx.font='600 '+Math.round(cell*0.6)+'px Figtree, sans-serif';ctx.textAlign='center';
      ctx.fillText(p.txt,(p.x+.5)*cell,(p.y+.2)*cell-p.t*cell*0.8);ctx.globalAlpha=1;
    }
    if(state==='play'&&(readyT>0||!armed)){
      ctx.fillStyle='#f6d98a';ctx.font=Math.round(cell*1.1)+'px Italiana, Georgia, serif';ctx.textAlign='center';
      ctx.fillText('Ready',COLS*cell/2,9.8*cell+cell*0.1);
      if(readyT<=0){ctx.font='500 '+Math.round(cell*0.5)+'px Figtree, sans-serif';ctx.fillText('tap an arrow to begin',COLS*cell/2,10.9*cell);}
    }
  }
  function frame(now){
    var dt=Math.min(0.05,(now-last)/1000);last=now;clock+=dt;
    if(state==='play')update(dt);
    draw();
    raf=requestAnimationFrame(frame);
  }
  function layout(){
    var top=document.getElementById('gtop').offsetHeight,bot=document.getElementById('gbot').offsetHeight;
    var avW=game.clientWidth-24,avH=game.clientHeight-top-bot-12;
    cell=Math.max(14,Math.floor(Math.min(avW/COLS,avH/ROWS,40)));
    var dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=COLS*cell*dpr;cv.height=ROWS*cell*dpr;
    cv.style.width=COLS*cell+'px';cv.style.height=ROWS*cell+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  /* ---- cards: start, game over, win ---- */
  function cast(k){
    var on=k===hero;
    return '<button type="button" data-pick="'+k+'"'+(on?' class="on" aria-pressed="true"':' aria-pressed="false"')+'><img src="'+PHOTO[k]+'" alt="" width="52" height="52"><figcaption>'+(on?'You':NAMES[k])+'</figcaption></button>';
  }
  function showCard(kind){
    var h='';
    if(kind==='start'){
      h='<div class="plate"><p class="eyebrow">Save the date &middot; 2027</p><p class="names">Simran '+AMP+' Adam</p><p class="date">Festivities from Friday April 9th to Saturday April 10th</p></div>'+
        '<div class="cast">'+CHARS.map(cast).join('')+'</div><p class="pickhint">Tap a face to play as them</p>';
    }else if(kind==='over'){
      h='<p class="big">The hounds won this round</p><p class="gtip">Score '+score+'. Want another go?</p>'+
        '<div class="gbtns"><button class="hint" type="button" data-act="play"><b>Try again</b><span>marigolds are waiting</span></button></div>';
    }else{
      h='<p class="big">You did it!</p><p class="gtip">Score '+score+'. Opening the date&hellip;</p>';
    }
    gcard.getAnimations().forEach(function(a){a.cancel();});
    gcard.innerHTML=h;gcard.hidden=false;
    var b=gcard.querySelector('[data-act="play"]');if(b)try{b.focus({preventScroll:true});}catch(_){}
  }
  var introT=0;
  function play(){gcard.getAnimations().forEach(function(a){a.cancel();});gcard.hidden=true;newGame();state='play';}
  function startPlay(){
    if(state!=='start')return;
    clearTimeout(introT);
    newGame();state='play';
    var a=gcard.animate([{opacity:1},{opacity:0}],{duration:reduce?1:500,fill:'forwards'});
    a.onfinish=function(){if(state!=='start'){gcard.hidden=true;gcard.getAnimations().forEach(function(x){x.cancel();});}};
  }
  function gameOver(){state='over';showCard('over');}
  function win(){state='win';showCard('win');setTimeout(function(){reveal();},1700);}
  gcard.addEventListener('click',function(e){
    var pk=e.target.closest&&e.target.closest('[data-pick]');
    if(pk&&state==='start'){
      setHero(pk.getAttribute('data-pick'));newGame();showCard('start');
      clearTimeout(introT);introT=setTimeout(startPlay,3200);
      return;
    }
    var b=e.target.closest&&e.target.closest('[data-act]');
    if(b&&b.getAttribute('data-act')==='play')play();
    else if(state==='start')startPlay();
  });

  /* ---- input ---- */
  var KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right',W:'up',A:'left',S:'down',D:'right'};
  document.addEventListener('keydown',function(e){
    if(revealed||game.hidden)return;
    var d=KEYS[e.key];
    if(d){setWant(d);e.preventDefault();}
  });
  Array.prototype.forEach.call(document.querySelectorAll('#dpad button'),function(b){
    b.addEventListener('pointerdown',function(e){e.preventDefault();setWant(b.getAttribute('data-dir'));});
  });
  var sw=null;
  var gm=document.getElementById('gmid');
  gm.addEventListener('pointerdown',function(e){sw={x:e.clientX,y:e.clientY};});
  gm.addEventListener('pointermove',function(e){
    if(!sw)return;
    var dx=e.clientX-sw.x,dy=e.clientY-sw.y;
    if(Math.abs(dx)<22&&Math.abs(dy)<22)return;
    setWant(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
    sw={x:e.clientX,y:e.clientY};
  });
  gm.addEventListener('pointerup',function(){sw=null;});
  gm.addEventListener('pointercancel',function(){sw=null;});

  /* ---- reveal the save the date underneath ---- */
  function reveal(){
    if(revealed)return;
    revealed=true;
    if(!reduce)confetti(window.innerWidth/2,window.innerHeight*0.4);
    main.style.transition='transform 1s cubic-bezier(.2,.8,.2,1), opacity .9s ease';
    main.style.transform='scale(1)';main.style.opacity='1';
    var a=game.animate([{opacity:1,transform:'none'},{opacity:0,transform:reduce?'none':'translateY(-28px) scale(1.03)'}],{duration:reduce?250:800,easing:'ease-in',fill:'forwards'});
    a.onfinish=finishReveal;
  }
  function finishReveal(){
    game.hidden=true;
    game.getAnimations().forEach(function(a){a.cancel();});
    cancelAnimationFrame(raf);
    document.documentElement.classList.remove('sealed');
    main.inert=false;
    main.style.transition='';main.style.transform='';main.style.opacity='';
    main.focus({preventScroll:true});
    window.scrollTo(0,0);
  }
  document.getElementById('skip').addEventListener('click',reveal);

  /* ---- start ---- */
  main.inert=true;
  main.style.transform='scale(.96)';main.style.opacity='.6';
  layout();
  window.addEventListener('resize',layout);
  newGame();state='start';showCard('start');
  introT=setTimeout(startPlay,4500);
  last=performance.now();raf=requestAnimationFrame(frame);

  /* ---- play again ---- */
  document.getElementById('replay').addEventListener('click',function(){
    revealed=false;
    game.getAnimations().forEach(function(a){a.cancel();});
    game.hidden=false;
    document.documentElement.classList.add('sealed');
    main.inert=true;
    main.style.transition='none';main.style.transform='scale(.96)';main.style.opacity='.6';
    window.scrollTo(0,0);
    layout();play();
    cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
